name: Generate Metrics Card

on:
  schedule:
    - cron: "40 23 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jeiel85
          filename: metrics.svg
          output_action: none
          template: classic
          config_timezone: Asia/Seoul
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github
          extras_css: |
            body { background: #0d1117; }
            svg { color: #c9d1d9; }
            h2 { color: #8b5cf6 !important; }
            a { color: #8b5cf6; }
            .field .value { color: #c9d1d9; }

      - name: Move SVG into publish folder
        run: |
          mkdir -p dist
          mv metrics.svg dist/metrics.svg

      - name: Publish generated SVG file
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: metrics
          force_orphan: true
